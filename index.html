<style>
:root{--pink:#ff2d75;--hot:#d81159;--soft-pink:#ffe3ec;--pale:#fff5f8;--ink:#4a1228}
*{box-sizing:border-box}
html,body,#map{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{background:var(--pale);color:var(--ink)}
#map{background:#ffd5e5}

/* Розовый фильтр на тайлы карты */
.leaflet-tile-pane {
  filter: sepia(0.35) hue-rotate(285deg) saturate(2.1) brightness(1.03) contrast(0.95);
}

/* Маркеры */
.art-marker{
  width:36px;
  height:36px;
  border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);
  background:linear-gradient(135deg,#ff3377,#b80648);
  border:2.5px solid #ffffff;
  box-shadow:0 4px 12px rgba(184,6,72,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform 0.15s ease;
}
.art-marker span{
  transform:rotate(45deg);
  font-size:17px;
}
.art-marker:active{
  transform:rotate(-45deg) scale(1.15);
}

/* Карточка Popup */
.leaflet-popup-content-wrapper{
  background:rgba(255,250,252,0.98);
  border:1.5px solid #ff9ebb;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(184,6,72,0.22);
  padding:6px;
}
.leaflet-popup-tip{
  background:#fff5f8;
  border:1px solid #ff9ebb;
}
.popup-box{
  width:240px;
  color:var(--ink);
}
.popup-box h3{
  margin:4px 0 6px 0;
  color:var(--hot);
  font-size:16px;
  font-weight:800;
}
.popup-img{
  width:100%;
  height:135px;
  object-fit:cover;
  border-radius:12px;
  margin:6px 0;
  display:block;
  background:#ffe0ed;
}
.popup-box p{
  font-size:12px;
  line-height:1.4;
  margin:6px 0;
  color:#552233;
}
.tag{
  display:inline-block;
  background:#ffe0ec;
  color:var(--hot);
  font-size:10px;
  font-weight:800;
  padding:3px 8px;
  border-radius:8px;
  margin-top:2px;
}

.leaflet-control-zoom a{
  background:#fff0f6!important;
  color:var(--hot)!important;
  border-color:#ffb5ce!important;
  border-radius:10px!important;
}
</style>
</head>

const bounds = L.latLngBounds([56.68, 60.37], [56.98, 60.84]);

const map = L.map('map', {
  center: [56.8375, 60.6065],
  zoom: 13,
  minZoom: 11,
  maxZoom: 19,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0,
  zoomControl: false
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Слой карты OpenStreetMap (светлый, с розовым CSS фильтром поверх)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

// Кастомный маркер
function createIcon(emoji = '🎨') {
  return L.divIcon({
    className: '',
    html: `<div class="art-marker"><span>${emoji}</span></div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -32]
  });
}

function getPhotoCandidates(item){
  const a=[];
  if (externalPhotos[item.name]) a.push(externalPhotos[item.name]);
  if (item.img && !/wikipedia\.org|wikimedia\.org/i.test(item.img)) a.push(item.img);
  return [...new Set(a)];
}

function photoCandidates(item){
  const arr=[];
  const add=(url)=>{
    if(!url || typeof url!=='string') return;
    const u=url.trim();
    if(!u || arr.includes(u)) return;
    // Только прямые изображения. Страницы сайтов и поисковые запросы не показываем.
    if(/\.(?:html?|php)(?:[?#]|$)/i.test(u)) return;
    if(/\/(?:search|reviews?|maps|location)(?:[/?]|$)/i.test(u)) return;
    arr.push(u);
  };
  if(photoDirect[item.name]) add(photoDirect[item.name]);
  const ex=externalPhotos[item.name];
  (Array.isArray(ex) ? ex : [ex]).forEach(add);
  if(item.img && /\.(?:jpe?g|png|webp|gif|avif)(?:[?#]|$)/i.test(item.img)) add(item.img);
  // Для хостингов, запрещающих hotlink с file://, добавляем два image-only прокси.
  const direct=[...arr];
  direct.forEach(u=>{
    const encoded=encodeURIComponent(u);
    add('https://images.weserv.nl/?url='+encoded+'&w=1400&q=90');
    add('https://wsrv.nl/?url='+encoded+'&w=1400&q=90');
    add('https://wsrv.nl/?url='+encodeURIComponent(u)+'&output=webp&w=1400&q=88');
  });
  return [...new Set(arr)];
}

const photoCache = new Map();
function loadImageVerified(url){
  if(photoCache.has(url)) return photoCache.get(url);
  const promise=new Promise((resolve,reject)=>{
    const probe=new Image();
    let finished=false;
    const finish=(ok)=>{
      if(finished) return;
      finished=true;
      clearTimeout(timer);
      probe.onload=null; probe.onerror=null;
      ok ? resolve(url) : reject(new Error('image failed'));
    };
    const timer=setTimeout(()=>finish(false),15000);
    probe.onload=async ()=>{
      try{ if(probe.decode) await probe.decode(); }catch(e){}
      finish(probe.naturalWidth>0 && probe.naturalHeight>0);
    };
    probe.onerror=()=>finish(false);
    probe.referrerPolicy='no-referrer';
    probe.src=url;
  });
  photoCache.set(url,promise);
  return promise;
}

async function attachPhotoFallback(img,item,candidates){
  if(!img) return;
  for(const url of candidates){
    try{
      const good=await loadImageVerified(url);
      img.src=good;
      img.classList.add('photo-ready');
      return;
    }catch(e){}
  }
  img.src=fallbackSvg(item);
}
const markers=[];
arts.forEach(item=>{
  const marker=L.marker(item.coords,{icon:createIcon(item.emoji)});
  const candidates=photoCandidates(item);
  const popupContent=`<div class="popup-box"><h3>${esc(item.name)}</h3><img class="popup-img" alt="${esc(item.name)}" loading="eager" referrerpolicy="no-referrer"><p>${esc(item.desc)}</p><span class="tag">${esc(item.tag)}</span></div>`;
  marker.bindPopup(popupContent);
  marker.on('popupopen',()=>{
    const el=marker.getPopup().getElement();
    const img=el&&el.querySelector('.popup-img');
    if(img) attachPhotoFallback(img,item,candidates);
  });
  marker._artName=item.name.toLowerCase();
  marker.addTo(map); markers.push(marker);
});

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Провод — мессенджер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161c;
    --panel:#1a202b;
    --panel-2:#212836;
    --paper:#ece6d6;
    --accent:#4fa8a0;
    --accent-dim:#3a7d77;
    --amber:#e8b34f;
    --text:#eceef2;
    --text-dim:#8a93a6;
    --danger:#e2665c;
    --border:#2a3140;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-dim);color:#fff;}

  #authScreen, #appScreen{height:100vh;height:100dvh;}
  .hidden{display:none !important;}

  /* ---------- auth ---------- */
  #authScreen{
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(79,168,160,0.10), transparent 60%),
      radial-gradient(500px 380px at 85% 90%, rgba(232,179,79,0.08), transparent 60%),
      var(--bg);
  }
  .auth-card{width:100%;max-width:380px;}
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .logo-mark{width:28px;height:28px;flex:0 0 auto;}
  .logo-mark svg{display:block;width:100%;height:100%;}
  .brand{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .tagline{color:var(--text-dim);font-size:14px;margin:0 0 28px;}

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text-dim);border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s, color .15s;}
  .tab-btn.active{background:var(--accent);color:#0d1512;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .field input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:15px;outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--accent);}

  .primary-btn{width:100%;padding:12px 0;border:none;border-radius:9px;background:var(--accent);color:#0d1512;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter .15s, transform .05s;}
  .primary-btn:hover{filter:brightness(1.08);}
  .primary-btn:active{transform:scale(0.98);}
  .primary-btn:disabled{opacity:.55;cursor:default;}

  .auth-msg{min-height:18px;font-size:13px;margin-top:12px;color:var(--danger);}
  .auth-msg.ok{color:var(--accent);}

  /* ---------- app ---------- */
  #appScreen{display:grid;grid-template-columns:320px 1fr;background:var(--bg);}

  .sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;}
  .sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  .sidebar-head .top-row{display:flex;align-items:center;justify-content:space-between;}
  .me-row{display:flex;align-items:center;gap:9px;min-width:0;}
  .me-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .logout-btn{background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;padding:6px 8px;border-radius:6px;white-space:nowrap;}
  .logout-btn:hover{color:var(--danger);background:rgba(226,102,92,0.08);}

  /* --- search --- */
  .search-wrap{
    display:flex;align-items:center;gap:8px;
    margin-top:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 11px;
    transition:border-color .15s;
  }
  .search-wrap:focus-within{border-color:var(--accent);}
  .search-wrap svg{width:15px;height:15px;color:var(--text-dim);flex:0 0 auto;}
  .search-wrap input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--text);font-size:14px;min-width:0;
  }
  .search-wrap input::placeholder{color:var(--text-dim);}
  .search-clear{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-size:16px;line-height:1;padding:0 2px;display:none;
  }
  .search-clear.show{display:block;}

  .search-results{padding:6px 8px;border-bottom:1px solid var(--border);}
  .search-empty{color:var(--text-dim);font-size:12.5px;text-align:center;padding:14px 10px;}
  .search-result{
    display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer;
  }
  .search-result:hover{background:var(--panel-2);}
  .search-result .avatar{width:32px;height:32px;font-size:13px;}
  .search-result .person-name{font-size:14px;}

  .list-scroll{flex:1;overflow-y:auto;padding:6px 8px;}

  .person-row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer;transition:background .12s;}
  .person-row:hover{background:var(--panel-2);}
  .person-row.active{background:var(--panel-2);}
  .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#0d1512;flex:0 0 auto;}
  .person-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .person-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty-hint{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 20px;line-height:1.5;}

  /* ---------- chat ---------- */
  .chat-panel{display:flex;flex-direction:column;min-width:0;height:100%;}
  .chat-header{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .back-btn{display:none;background:none;border:none;color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;flex:0 0 auto;}
  .back-btn svg{width:18px;height:18px;}
  .back-btn:hover{background:var(--panel-2);}
  .chat-title{font-size:15px;font-weight:600;}

  .messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:2px;}
  .day-divider{align-self:center;color:var(--text-dim);font-size:11.5px;background:var(--panel);padding:3px 10px;border-radius:20px;margin:14px 0 10px;}
  .msg-row{display:flex;margin:3px 0;max-width:100%;}
  .msg-row.mine{justify-content:flex-end;}
  .bubble{max-width:min(460px,72%);padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap;position:relative;}
  .msg-row.theirs .bubble{background:var(--panel-2);color:var(--text);border-bottom-left-radius:4px;}
  .msg-row.mine .bubble{background:var(--paper);color:#20241f;border-bottom-right-radius:4px;}

  .bubble .meta{
    display:flex;align-items:center;justify-content:flex-end;gap:4px;
    font-size:10.5px;opacity:.6;margin-top:3px;
  }
  .bubble .meta .ticks{display:inline-flex;align-items:center;line-height:1;}
  .bubble .meta .ticks svg{width:14px;height:10px;display:block;}
  .bubble .meta .ticks.read{color:var(--accent);opacity:1;}

  .empty-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;text-align:center;padding:20px;}

  .composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--border);flex:0 0 auto;}
  .composer input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:20px;font-size:14.5px;outline:none;}
  .composer input:focus{border-color:var(--accent);}
  .send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:filter .15s, transform .05s;}
  .send-btn:hover{filter:brightness(1.08);}
  .send-btn:active{transform:scale(0.94);}
  .send-btn svg{width:18px;height:18px;color:#0d1512;}

  @media (max-width:760px){
    #appScreen{grid-template-columns:1fr;position:relative;overflow:hidden;}
    .sidebar{border-right:none;position:absolute;inset:0;transform:translateX(0);transition:transform .22s ease;background:var(--bg);z-index:2;}
    .chat-panel{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;background:var(--bg);z-index:3;}
    #appScreen.chat-open .sidebar{transform:translateX(-30%);}
    #appScreen.chat-open .chat-panel{transform:translateX(0);}
    .back-btn{display:flex;}
  }

  .list-scroll::-webkit-scrollbar,
  .messages::-webkit-scrollbar{width:7px;}
  .list-scroll::-webkit-scrollbar-thumb,
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="authScreen">
  <div class="auth-card">
    <div class="logo-row">
      <span class="logo-mark">
        <svg viewBox="0 0 28 28" fill="none">
          <circle cx="6" cy="14" r="4" fill="#4fa8a0"/>
          <circle cx="22" cy="14" r="4" fill="#e8b34f"/>
          <line x1="10" y1="14" x2="18" y2="14" stroke="#4fa8a0" stroke-width="2"/>
        </svg>
      </span>
      <span class="brand">Провод</span>
    </div>
    <p class="tagline">Простой мессенджер по нику и паролю</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Вход</button>
      <button class="tab-btn" data-tab="register">Регистрация</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Никнейм</label>
        <input id="loginNick" autocomplete="username" placeholder="например, alex_99" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="primary-btn" type="submit">Войти</button>
    </form>

    <form id="registerForm" class="hidden">
      <div class="field">
        <label>Никнейм</label>
        <input id="regNick" autocomplete="username" placeholder="3–20 символов, без пробелов" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="regPass" type="password" autocomplete="new-password" placeholder="минимум 4 символа" required>
      </div>
      <div class="field">
        <label>Повторите пароль</label>
        <input id="regPass2" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <button class="primary-btn" type="submit">Создать аккаунт</button>
    </form>

    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appScreen" class="hidden">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="top-row">
        <div class="me-row">
          <div class="avatar" id="meAvatar"></div>
          <div class="me-name" id="meName"></div>
        </div>
        <button class="logout-btn" id="logoutBtn">Выйти</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="searchInput" placeholder="Найти по никнейму" autocomplete="off">
        <button class="search-clear" id="searchClear" title="Очистить">×</button>
      </div>
    </div>

    <div id="searchResults" class="search-results hidden"></div>

    <div class="list-scroll" id="chatList">
      <div class="empty-hint">Пока нет диалогов.</div>
    </div>
  </div>

  <div class="chat-panel">
    <div id="chatHeaderEmpty" class="empty-chat">Выберите чат слева</div>

    <div id="chatActive" class="hidden" style="display:contents;">
      <div class="chat-header">
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="avatar" id="partnerAvatar" style="width:32px;height:32px;font-size:13px;"></div>
        <div class="chat-title" id="chatTitle"></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="msgInput" placeholder="Написать сообщение…" autocomplete="off">
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* =========================================================
   FIREBASE
   ========================================================= */
firebase.initializeApp({
  databaseURL: "https://mess-f74a0-default-rtdb.firebaseio.com/"
});
const db = firebase.database();

/* =========================================================
   HELPERS
   ========================================================= */
const NICK_RE = /^[a-zA-Zа-яА-ЯёЁ0-9_]{3,20}$/;
const LS_KEY = "provod_auth";

async function hashPassword(pw){
  try{
    if (window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 0;
  for (let i=0;i<pw.length;i++){ h = (Math.imul(31,h) + pw.charCodeAt(i))|0; }
  return 'fb_' + (h>>>0).toString(16);
}

function saveLocalAuth(nickname, passwordHash){
  localStorage.setItem(LS_KEY, JSON.stringify({nickname, passwordHash}));
}
function clearLocalAuth(){ localStorage.removeItem(LS_KEY); }
function getLocalAuth(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch(e){ return null; }
}

function chatIdFor(a, b){ return [a,b].sort().join("__"); }

const HUE_PALETTE = ['#4fa8a0','#e8b34f','#c97a6d','#7c9ed9','#8fb87a','#c78fce','#5fb3c9'];
function colorFor(name){
  let h = 0;
  for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return HUE_PALETTE[h % HUE_PALETTE.length];
}
function initialFor(name){ return (name || '?').trim().charAt(0).toUpperCase(); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* галочки */
function ticksHtml(mine, msg){
  if (!mine) return '';
  // если у собеседника нет данных о прочтении — считаем, что доставлено
  const read = !!msg.readAt;
  const cls = read ? 'ticks read' : 'ticks';
  if (read){
    // двойная галочка
    return `<span class="${cls}" title="Прочитано"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5.5L4.5 9L10 2"/><path d="M6 5.5L9.5 9L15 2"/></svg></span>`;
  }
  // одинарная галочка (доставлено)
  return `<span class="${cls}" title="Доставлено"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5L6 9.5L13 2"/></svg></span>`;
}

/* =========================================================
   STATE
   ========================================================= */
let currentUser = null;
let currentPartner = null;
let messagesRef = null;
let messagesCb = null;
let chatListRef = null;
let searchUsersRef = null;
let allUsers = [];
let userChatsMap = {};

/* =========================================================
   AUTH SCREEN
   ========================================================= */
const authMsgEl = document.getElementById('authMsg');
function setAuthMsg(text, ok){
  authMsgEl.textContent = text || '';
  authMsgEl.classList.toggle('ok', !!ok);
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const isLogin = btn.dataset.tab === 'login';
    document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
    document.getElementById('registerForm').classList.toggle('hidden', isLogin);
    setAuthMsg('');
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nickname = document.getElementById('loginNick').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = e.target.querySelector('button');
  btn.disabled = true; setAuthMsg('Проверяем…');
  try{
    const snap = await db.ref('users/'+nickname).get();
    if (!snap.exists()) throw new Error('Такого пользователя нет');
    const hash = await hashPassword(password);
    if (snap.val().passwordHash !== hash) throw new Error('Неверный пароль');
    saveLocalAuth(nickname, hash);
    enterApp(nickname);
  }catch(err){
    setAuthMsg(err.message || 'Ошибка входа');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nickname = document.getElementById('regNick').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  const btn = e.target.querySelector('button');

  if (!NICK_RE.test(nickname)){
    setAuthMsg('Ник: 3–20 символов, буквы/цифры/подчёркивание, без пробелов'); return;
  }
  if (password.length < 4){ setAuthMsg('Пароль должен быть не короче 4 символов'); return; }
  if (password !== password2){ setAuthMsg('Пароли не совпадают'); return; }

  btn.disabled = true; setAuthMsg('Создаём аккаунт…');
  try{
    const snap = await db.ref('users/'+nickname).get();
    if (snap.exists()) throw new Error('Этот ник уже занят');
    const hash = await hashPassword(password);
    await db.ref('users/'+nickname).set({passwordHash: hash, createdAt: Date.now()});
    saveLocalAuth(nickname, hash);
    enterApp(nickname);
  }catch(err){
    setAuthMsg(err.message || 'Ошибка регистрации');
  }finally{
    btn.disabled = false;
  }
});

(function tryAutoLogin(){
  const saved = getLocalAuth();
  if (!saved || !saved.nickname || !saved.passwordHash){ return; }
  db.ref('users/'+saved.nickname).get()
    .then(snap=>{
      if (snap.exists() && snap.val().passwordHash === saved.passwordHash){
        enterApp(saved.nickname);
      } else {
        clearLocalAuth();
      }
    })
    .catch(()=>{ enterApp(saved.nickname); });
})();

/* =========================================================
   ENTER APP
   ========================================================= */
function enterApp(nickname){
  currentUser = nickname;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('meName').textContent = nickname;
  const meAv = document.getElementById('meAvatar');
  meAv.textContent = initialFor(nickname);
  meAv.style.background = colorFor(nickname);
  listenChatList();
  listenAllUsers();
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if (chatListRef) chatListRef.off();
  if (searchUsersRef) searchUsersRef.off();
  if (messagesRef && messagesCb) messagesRef.off('value', messagesCb);
  clearLocalAuth();
  currentUser = null; currentPartner = null;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('loginPass').value = '';
  setAuthMsg('');
  // очистить поиск
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchClear').classList.remove('show');
});

/* =========================================================
   СПИСОК ЧАТОВ
   ========================================================= */
function listenChatList(){
  if (chatListRef) chatListRef.off();
  chatListRef = db.ref('userChats/' + currentUser);
  chatListRef.on('value', snap=>{
    userChatsMap = snap.val() || {};
    renderChatList(userChatsMap);
  });
}

function renderChatList(map){
  const el = document.getElementById('chatList');
  const names = Object.keys(map);
  if (!names.length){
    el.innerHTML = '<div class="empty-hint">Пока нет диалогов.<br>Найдите пользователя по нику, чтобы начать переписку.</div>';
    return;
  }
  el.innerHTML = '';
  names.forEach(name=>{
    const row = document.createElement('div');
    row.className = 'person-row' + (name === currentPartner ? ' active' : '');
    row.innerHTML = `
      <div class="avatar" style="background:${colorFor(name)}">${initialFor(name)}</div>
      <div><div class="person-name">${escapeHtml(name)}</div></div>`;
    row.addEventListener('click', ()=>openChat(name));
    el.appendChild(row);
  });
}

/* =========================================================
   ПОИСК ПОЛЬЗОВАТЕЛЕЙ
   ========================================================= */
function listenAllUsers(){
  if (searchUsersRef) searchUsersRef.off();
  searchUsersRef = db.ref('users');
  searchUsersRef.on('value', snap=>{
    const val = snap.val() || {};
    allUsers = Object.keys(val).filter(n => n !== currentUser);
  });
}

const searchInput = document.getElementById('searchInput');
const searchResultsEl = document.getElementById('searchResults');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  searchClear.classList.toggle('show', q.length > 0);
  if (!q){ searchResultsEl.classList.add('hidden'); searchResultsEl.innerHTML=''; return; }
  const matches = allUsers.filter(n => n.toLowerCase().includes(q)).slice(0, 20);
  searchResultsEl.classList.remove('hidden');
  if (!matches.length){
    searchResultsEl.innerHTML = '<div class="search-empty">Никого не найдено</div>';
    return;
  }
  searchResultsEl.innerHTML = '';
  matches.forEach(name=>{
    const row = document.createElement('div');
    row.className = 'search-result';
    row.innerHTML = `
      <div class="avatar" style="background:${colorFor(name)}">${initialFor(name)}</div>
      <div class="person-name">${escapeHtml(name)}</div>`;
    row.addEventListener('click', ()=>{
      openChat(name);
      // очистить поиск после выбора
      searchInput.value = '';
      searchClear.classList.remove('show');
      searchResultsEl.classList.add('hidden');
      searchResultsEl.innerHTML = '';
    });
    searchResultsEl.appendChild(row);
  });
});

searchClear.addEventListener('click', ()=>{
  searchInput.value = '';
  searchClear.classList.remove('show');
  searchResultsEl.classList.add('hidden');
  searchResultsEl.innerHTML = '';
  searchInput.focus();
});

/* =========================================================
   ОТКРЫТИЕ ЧАТА
   ========================================================= */
function openChat(partner){
  if (messagesRef && messagesCb) messagesRef.off('value', messagesCb);

  currentPartner = partner;
  const chatId = chatIdFor(currentUser, partner);

  document.getElementById('chatHeaderEmpty').classList.add('hidden');
  document.getElementById('chatActive').classList.remove('hidden');
  document.getElementById('chatTitle').textContent = partner;
  const pAv = document.getElementById('partnerAvatar');
  pAv.textContent = initialFor(partner);
  pAv.style.background = colorFor(partner);

  document.getElementById('appScreen').classList.add('chat-open');

  // пометить все входящие как прочитанные при открытии
  markChatAsRead(chatId);

  messagesRef = db.ref('chats/' + chatId + '/messages').orderByChild('ts');
  messagesCb = snap => {
    renderMessages(snap.val() || {});
    markChatAsRead(chatId);
  };
  messagesRef.on('value', messagesCb);

  document.querySelectorAll('#chatList .person-row').forEach(r=>r.classList.remove('active'));
}

async function markChatAsRead(chatId){
  if (!currentPartner) return;
  const snap = await db.ref('chats/' + chatId + '/messages').get();
  if (!snap.exists()) return;
  const updates = {};
  snap.forEach(child=>{
    const m = child.val();
    if (m && m.from !== currentUser && !m.readAt){
      updates[child.key + '/readAt'] = Date.now();
    }
  });
  if (Object.keys(updates).length){
    try{ await db.ref('chats/' + chatId + '/messages').update(updates); }catch(e){}
  }
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  document.getElementById('appScreen').classList.remove('chat-open');
});

function renderMessages(map){
  const el = document.getElementById('messages');
  const items = Object.values(map).sort((a,b)=>a.ts - b.ts);
  el.innerHTML = '';
  let lastDay = null;
  items.forEach(m=>{
    const d = new Date(m.ts);
    const dayKey = d.toDateString();
    if (dayKey !== lastDay){
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
      el.appendChild(div);
      lastDay = dayKey;
    }
    const mine = m.from === currentUser;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `${escapeHtml(m.text)}<span class="meta">${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}${ticksHtml(mine, m)}</span>`;
    row.appendChild(bubble);
    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

/* =========================================================
   ОТПРАВКА
   ========================================================= */
async function sendCurrentMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentPartner) return;
  input.value = '';
  const chatId = chatIdFor(currentUser, currentPartner);
  await db.ref('chats/' + chatId + '/messages').push({
    from: currentUser,
    text: text,
    ts: firebase.database.ServerValue.TIMESTAMP
  });
  await db.ref('userChats/' + currentUser + '/' + currentPartner).set(true);
  await db.ref('userChats/' + currentPartner + '/' + currentUser).set(true);
}

document.getElementById('sendBtn').addEventListener('click', sendCurrentMessage);
document.getElementById('msgInput').addEventListener('keydown', e=>{
  if (e.key === 'Enter'){ e.preventDefault(); sendCurrentMessage(); }
});
</script>
